name: Desktop validation and unsigned bundles
on:
  push:
    branches: [main, 'feat/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p poker-core --all-targets -- -D warnings
      - run: cargo test -p poker-core
      - run: npm test
      - run: npm run build
      - if: runner.os == 'macOS'
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles app
      - if: runner.os == 'Windows'
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles nsis
      - uses: actions/upload-artifact@v4
        with:
          name: riverlens-${{ matrix.target }}-unsigned
          path: target/${{ matrix.target }}/release/bundle/
          if-no-files-found: error
          retention-days: 14
