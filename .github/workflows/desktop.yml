name: Desktop validation and verified bundles
on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-15
            target: aarch64-apple-darwin
          - os: macos-15-intel
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.99.1
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - uses: Swatinem/rust-cache@v2
        with:
          shared-key: ${{ matrix.target }}
          save-if: ${{ github.ref == 'refs/heads/main' }}
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy --workspace --all-targets -- -D warnings
      # The desktop shell has no Rust tests; Clippy already checks it.
      - run: cargo test --workspace --exclude riverlens --profile ci
      - run: node --test scripts/signing-env.test.mjs
      - run: npm test
      - run: npm run build
      - if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles app --config src-tauri/tauri.conf.ci.json
      - if: runner.os == 'macOS'
        name: Seal app and verify archived signature
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: bash scripts/package-macos.sh target/${{ matrix.target }}/release/bundle/macos/RiverLens.app target/${{ matrix.target }}/release/bundle/RiverLens_${{ matrix.target }}.app.zip
      - if: runner.os == 'macOS'
        name: Archive the final sealed app for the in-app updater
        shell: bash
        env:
          TARGET: ${{ matrix.target }}
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: |
          set -euo pipefail
          bundle="target/$TARGET/release/bundle"
          archive="$bundle/RiverLens_$TARGET.app.tar.gz"
          COPYFILE_DISABLE=1 /usr/bin/tar -czf "$archive" -C "$bundle/macos" RiverLens.app
          check_dir=$(mktemp -d)
          trap 'rm -rf "$check_dir"' EXIT
          /usr/bin/tar -xzf "$archive" -C "$check_dir"
          app="$check_dir/RiverLens.app"
          /usr/bin/codesign --verify --deep --strict "$app"
          test -x "$app/Contents/MacOS/riverlens"
          test "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "$app/Contents/Info.plist")" = "$(node -p "require('./package.json').version")"
          arch="${TARGET%%-*}"
          /usr/bin/lipo "$app/Contents/MacOS/riverlens" -verify_arch "${arch/aarch64/arm64}"
          if [[ "$APPLE_SIGNING_IDENTITY" != "-" ]]; then
            /usr/bin/xcrun stapler validate "$app"
            /usr/sbin/spctl --assess --type execute "$app"
          fi
      - if: runner.os == 'Windows'
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles nsis --config src-tauri/tauri.conf.ci.json
      - name: Record bundle sizes
        shell: bash
        run: node scripts/build-metrics.mjs target/${{ matrix.target }}
      - name: Packaged MCP smoke (native target)
        shell: bash
        run: |
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          node scripts/mcp-smoke.mjs "target/${{ matrix.target }}/release/riverlens${suffix}"
      - uses: actions/upload-artifact@v4
        with:
          name: riverlens-${{ matrix.target }}-verified
          path: |
            target/${{ matrix.target }}/release/bundle/*.app.zip
            target/${{ matrix.target }}/release/bundle/*.app.tar.gz
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: riverlens-${{ matrix.target }}-metrics
          path: target/${{ matrix.target }}/release/build-metrics.json
          if-no-files-found: error
          retention-days: 14

      # All production bundles have been uploaded. Fixture builds stay on this runner.
      - name: Install, update and reopen two native RiverLens builds with an isolated profile
        run: node scripts/native-updater-smoke.mjs ${{ matrix.target }}

  update-feed:
    needs: desktop
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci --ignore-scripts
      - name: Install signature verifier
        run: sudo apt-get update -qq && sudo apt-get install -y minisign
      - uses: actions/download-artifact@v4
        with:
          pattern: riverlens-*-verified
          path: verified-bundles
          merge-multiple: true
      - if: "!startsWith(github.ref, 'refs/tags/v')"
        name: Validate the update feed with a disposable signing key
        env:
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ci-fixture
        run: |
          set -euo pipefail
          key="$RUNNER_TEMP/riverlens-ci-updater.key"
          trap 'rm -f "$key" "$key.pub"' EXIT
          node_modules/.bin/tauri signer generate --ci --password "$TAURI_SIGNING_PRIVATE_KEY_PASSWORD" --write-keys "$key" >/dev/null
          export TAURI_SIGNING_PRIVATE_KEY_PATH="$key"
          node scripts/release-manifest.mjs verified-bundles release-assets --test-key "$key.pub"
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Read the public key trusted by the current stable release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          previous=$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq '.tag_name')
          gh api --method GET "repos/$GITHUB_REPOSITORY/contents/src-tauri/tauri.conf.json" \
            -f ref="$previous" -H 'Accept: application/vnd.github.raw+json' > "$RUNNER_TEMP/previous-desktop.json"
      - if: startsWith(github.ref, 'refs/tags/v')
        name: Sign and verify final update payloads against the shipped public key
        env:
          RIVERLENS_PREVIOUS_DESKTOP_CONFIG: ${{ runner.temp }}/previous-desktop.json
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          MACOS_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY && 'developer-id-notarized' || 'ad-hoc-not-notarized' }}
        run: node scripts/release-manifest.mjs verified-bundles release-assets
      - if: startsWith(github.ref, 'refs/tags/v')
        uses: actions/upload-artifact@v4
        with:
          name: riverlens-release
          path: release-assets/*
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: update-feed
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: riverlens-release
          path: release-assets
      - name: Check the downloaded release before drafting
        working-directory: release-assets
        run: sha256sum --check SHA256SUMS.txt
      - name: Create reviewable release draft from validated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --draft --title "RiverLens $GITHUB_REF_NAME" --notes-file "docs/release-$GITHUB_REF_NAME.md"
