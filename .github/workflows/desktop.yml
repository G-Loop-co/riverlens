name: Desktop validation and unsigned bundles
on:
  push:
    branches: [main, "feat/**"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p poker-core -p riverlens-ai -p riverlens --all-targets -- -D warnings
      - run: cargo test -p poker-core -p riverlens-ai
      - run: npm test
      - run: npm run build
      - if: runner.os == 'macOS'
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles app
      - if: runner.os == 'macOS'
        name: Archive app with executable permissions
        run: ditto -c -k --sequesterRsrc --keepParent target/${{ matrix.target }}/release/bundle/macos/RiverLens.app target/${{ matrix.target }}/release/bundle/RiverLens_${{ matrix.target }}.app.zip
      - if: runner.os == 'Windows'
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles nsis
      - name: Packaged MCP smoke (native target)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          node scripts/mcp-smoke.mjs "target/${{ matrix.target }}/release/riverlens${suffix}"
      - uses: actions/upload-artifact@v4
        with:
          name: riverlens-${{ matrix.target }}-unsigned
          path: |
            target/${{ matrix.target }}/release/bundle/*.app.zip
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14
