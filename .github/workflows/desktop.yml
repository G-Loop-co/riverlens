name: Desktop validation and verified bundles
on:
  push:
    branches: [main, "feat/**"]
    tags: ["v*"]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  desktop:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: macos-14
            target: aarch64-apple-darwin
          - os: macos-14
            target: x86_64-apple-darwin
          - os: windows-latest
            target: x86_64-pc-windows-msvc
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.target }}
          components: rustfmt, clippy
      - run: npm ci
      - run: cargo fmt --all -- --check
      - run: cargo clippy -p poker-core -p riverlens-ai -p riverlens --all-targets -- -D warnings
      - run: cargo test -p poker-core -p riverlens-ai
      - run: npm test
      - run: npm run build
      - if: runner.os == 'macOS'
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles app
      - if: runner.os == 'macOS'
        name: Seal app and verify archived signature
        env:
          APPLE_SIGNING_IDENTITY: ${{ secrets.APPLE_SIGNING_IDENTITY || '-' }}
        run: bash scripts/package-macos.sh target/${{ matrix.target }}/release/bundle/macos/RiverLens.app target/${{ matrix.target }}/release/bundle/RiverLens_${{ matrix.target }}.app.zip
      - if: runner.os == 'Windows'
        run: npm run desktop:build -- --target ${{ matrix.target }} --bundles nsis
      - name: Packaged MCP smoke (native target)
        if: matrix.target != 'x86_64-apple-darwin'
        shell: bash
        run: |
          suffix=""
          if [ "${{ runner.os }}" = "Windows" ]; then suffix=".exe"; fi
          node scripts/mcp-smoke.mjs "target/${{ matrix.target }}/release/riverlens${suffix}"
      - uses: actions/upload-artifact@v4
        with:
          name: riverlens-${{ matrix.target }}-verified
          path: |
            target/${{ matrix.target }}/release/bundle/*.app.zip
            target/${{ matrix.target }}/release/bundle/nsis/*.exe
          if-no-files-found: error
          retention-days: 14

  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: desktop
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: actions/download-artifact@v4
        with:
          pattern: riverlens-*-verified
          path: release-assets
          merge-multiple: true
      - name: Verify asset inventory and generate checksums
        env:
          MACOS_SIGNING: ${{ secrets.APPLE_SIGNING_IDENTITY && 'developer-id-notarized' || 'ad-hoc-not-notarized' }}
        run: node scripts/release-manifest.mjs release-assets
      - name: Create reviewable release draft from validated tag
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" release-assets/* --verify-tag --draft --title "RiverLens $GITHUB_REF_NAME" --notes-file "docs/release-$GITHUB_REF_NAME.md"
