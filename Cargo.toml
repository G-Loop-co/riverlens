[workspace]
members = ["crates/poker-core", "src-tauri", "crates/riverlens-ai"]
default-members = ["crates/poker-core"]
resolver = "2"

[profile.release]
lto = "thin"
codegen-units = 16
strip = "symbols"

# CI keeps the 100k audit assertions intact while avoiding full debug codegen.
[profile.ci]
inherits = "dev"
opt-level = 1
debug = "line-tables-only"

[profile.ci.package."*"]
debug = false
