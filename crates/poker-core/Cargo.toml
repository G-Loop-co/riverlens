[package]
name = "poker-core"
version = "0.1.0"
edition = "2021"

[dependencies]
anyhow = "1"
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
regex = "1"
chrono = { version = "0.4", features = ["serde"] }
chrono-tz = "0.10"
rusqlite = { version = "0.37", features = ["bundled", "backup"] }
sha2 = "0.10"
zip = { version = "4", default-features = false, features = ["deflate"] }
walkdir = "2"
rs_poker = { version = "5", default-features = false }
tiny_http = "0.12"
flate2 = "1"

tempfile = "3"
